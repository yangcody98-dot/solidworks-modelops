name: Offline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install offline test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate package and regression contract
        run: |
          python scripts/validate_skill.py
          python scripts/sw_modeling.py validate --request examples/modeling_create.json
          python scripts/sw_modeling_regression.py validate --suite examples/modeling_regression_suite.json
      - name: Run explicit offline test set
        run: >-
          python -m pytest -q
          tests/test_sw_modeling.py
          tests/test_sw_modeling_regression.py
          tests/test_sw_checkpoints.py
          tests/test_sw_model_context.py
          tests/test_sw_plan_bridge.py
          tests/test_sw_closed_loop.py
          tests/test_sw_closed_loop_native.py
